name: PR Label Check

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]
    branches: [ "main" ]

jobs:
  check-labels:
    name: Check Release Labels
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
    - name: Check for release label
      uses: actions/github-script@v9
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          const labels = pr.labels.map(label => label.name);
          console.log('PR labels:', labels);

          // Define release labels
          const releaseLabels = ['major', 'minor', 'patch', 'no-release'];
          const hasReleaseLabel = labels.some(label => releaseLabels.includes(label));

          if (!hasReleaseLabel) {
            // Create a comment explaining the labels
            const comment = `## 🏷️ Release Label Required

          This PR needs a release label to indicate the type of change:

          - \`major\` - Breaking changes (1.0.0 → 2.0.0)
          - \`minor\` - New features (1.0.0 → 1.1.0)
          - \`patch\` - Bug fixes (1.0.0 → 1.0.1)
          - \`no-release\` - No release needed (docs, tests, etc.)

          **The PR will default to \`patch\` if no label is set.**`;

            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Release Label Required')
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

            console.log('⚠️ No release label found, but PR will default to patch');
          } else {
            console.log('✅ Release label found:', labels.filter(label => releaseLabels.includes(label)));
          }

          // Always pass - we don't want to block PRs, just inform
          return true;
