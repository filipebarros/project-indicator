name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for (e.g., v1.0.0)'
        required: true
        type: string
  repository_dispatch:
    types: [release-created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: Build and Upload
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: project-indicator-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: project-indicator-linux-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: project-indicator-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: project-indicator-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: project-indicator-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
    - name: Get release info
      id: release
      shell: bash
      env:
        INPUT_TAG: ${{ github.event.inputs.tag }}
        PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
      run: |
        TAG_NAME="${INPUT_TAG:-$PAYLOAD_TAG}"
        if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid or missing tag: '$TAG_NAME'" >&2
          exit 1
        fi
        echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
        echo "Tag name: $TAG_NAME"

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.release.outputs.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        fi
        cargo build --release --target ${{ matrix.target }}

    - name: Create archive (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        tar -czf ../../../${{ matrix.asset_name }} project-indicator
        cd ../../..
        ls -la ${{ matrix.asset_name }}

    - name: Create archive (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        cd target/${{ matrix.target }}/release
        Compress-Archive -Path project-indicator.exe -DestinationPath ../../../${{ matrix.asset_name }}
        cd ../../..
        ls ${{ matrix.asset_name }}

    - name: Upload Release Asset
      shell: bash
      run: |
        gh release upload "$TAG_NAME" ${{ matrix.asset_name }} --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ steps.release.outputs.tag_name }}
