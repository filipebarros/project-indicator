name: Release

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: Build and Upload
    permissions:
      contents: write # Required to upload release assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: project-indicator-linux-x86_64
            asset_name: project-indicator-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: project-indicator-linux-aarch64
            asset_name: project-indicator-linux-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: project-indicator-macos-x86_64
            asset_name: project-indicator-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: project-indicator-macos-aarch64
            asset_name: project-indicator-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: project-indicator-windows-x86_64.exe
            asset_name: project-indicator-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Get release version
      id: version
      shell: bash
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION_NUMBER=${VERSION#v}  # Remove 'v' prefix
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"
        echo "Version number: $VERSION_NUMBER"

    - name: Update version in Cargo.toml
      shell: bash
      run: |
        sed -i.bak "s/^version = \".*\"/version = \"${{ steps.version.outputs.version_number }}\"/" Cargo.toml
        echo "Updated version to ${{ steps.version.outputs.version_number }}"
        grep "^version" Cargo.toml

    - name: Build release binary
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        fi
        cargo build --release --target ${{ matrix.target }}

    - name: Create archive (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        tar -czf ../../../${{ matrix.asset_name }} project-indicator
        cd ../../..
        ls -la ${{ matrix.asset_name }}

    - name: Create archive (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../${{ matrix.asset_name }} project-indicator.exe
        cd ../../..
        ls -la ${{ matrix.asset_name }}

    - name: Upload Release Asset
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const assetPath = '${{ matrix.asset_name }}';
          const assetName = path.basename(assetPath);
          const assetData = fs.readFileSync(assetPath);

          await github.rest.repos.uploadReleaseAsset({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: ${{ github.event.release.id }},
            name: assetName,
            data: assetData,
          });
