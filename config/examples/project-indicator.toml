[meta]
version = "2.0"

[display]
show_frameworks = true
max_frameworks = 5
framework_separator = " • "

[cache]
enabled = true
max_entries = 2000
ttl_seconds = 600

[detection]
max_upward_traversal = 4
require_vcs_root = false
confidence_threshold = 0.4
max_depth = 3
detection_mode = "Thorough"

[[detection.root_indicators]]
pattern = ".git"
weight = 1.0
context = "VersionControl"

[[detection.root_indicators]]
pattern = ".hg"
weight = 1.0
context = "VersionControl"

[[detection.root_indicators]]
pattern = ".svn"
weight = 1.0
context = "VersionControl"

