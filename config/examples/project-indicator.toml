[meta]
version = "3.0"

[display]
show_frameworks = true
max_frameworks = 5
framework_separator = " • "

[detection]
max_upward_traversal = 4
require_vcs_root = false
confidence_threshold = 0.3
max_depth = 1
detection_mode = "Thorough"
max_matches_per_pattern = 15
small_project_threshold = 50
extreme_size_threshold = 500

[[detection.root_indicators]]
pattern = ".git"
weight = 1.0
context = "VersionControl"

[[detection.root_indicators]]
pattern = ".hg"
weight = 1.0
context = "VersionControl"

[[detection.root_indicators]]
pattern = ".svn"
weight = 1.0
context = "VersionControl"

