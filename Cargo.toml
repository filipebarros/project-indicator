[package]
name = "project-indicator"
version = "0.2.2"
edition = "2021"
authors = ["Filipe Barros <afbarros@me.com>"]
description = "Fast project type and framework detection for shell prompts"
license = "MIT"
repository = "https://github.com/filipebarros/project-indicator"
keywords = ["cli", "shell", "prompt", "project", "detection"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"

ignore = "0.4"
rayon = "1.7"
regex = "1.11"

anyhow = "1.0"
thiserror = "2.0"

dirs = "6.0"
log = "0.4"
env_logger = "0.11"

dashmap = "6.0"
tokio = { version = "1.0", features = ["fs", "macros", "rt"] }
futures = "0.3"

[dev-dependencies]
criterion = "0.7"
tempfile = "3.0"

[[bin]]
name = "project-indicator"
path = "src/main.rs"

[[bench]]
name = "simple_benchmark"
harness = false

[[bench]]
name = "detection_benchmark"
harness = false

[[bench]]
name = "performance_benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
