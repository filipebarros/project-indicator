[package]
name = "project-indicator"
version = "0.7.3"
edition = "2021"
authors = ["Filipe Barros <afbarros@me.com>"]
description = "Fast project type and framework detection for shell prompts"
license = "MIT"
repository = "https://github.com/filipebarros/project-indicator"
keywords = ["cli", "shell", "prompt", "project", "detection"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"

ignore = "0.4"
rayon = "1.11"
regex = "1.12.2"

anyhow = "1.0"
thiserror = "2.0"

dirs = "6.0"
log = "0.4"
env_logger = "0.11"

dashmap = "6.1"

uuid = { version = "1.19", features = ["v4", "serde"] }

chrono = "0.4" # For date formatting (YYYY-MM-DD.jsonl filenames)
colored = "3.0" # For terminal output formatting in diffs

[dev-dependencies]
criterion = "0.8"
tempfile = "3.23"
proptest = "1.9"

[[bin]]
name = "project-indicator"
path = "src/main.rs"

# Core benchmarks for key optimizations
[[bench]]
name = "parsed_file_cache_benchmark"
harness = false

[[bench]]
name = "pattern_matching_benchmark"
harness = false

[[bench]]
name = "filesystem_cache_benchmark"
harness = false

[[bench]]
name = "profiling_benchmark"
harness = false

[[bench]]
name = "framework_detection_benchmark"
harness = false

[[bench]]
name = "tracking_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
