[package]
name = "project-indicator"
version = "7.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Filipe Barros <afbarros@me.com>"]
description = "Fast project type and framework detection for shell prompts"
license = "MIT"
repository = "https://github.com/filipebarros/project-indicator"
keywords = ["cli", "shell", "prompt", "project", "detection"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
toml = "1.1"
toml_parser = "1"
serde_json = "1.0"

ignore = "0.4"

anyhow = "1.0"

log = "0.4"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27"
proptest = "1.11"

[[bin]]
name = "project-indicator"
path = "src/main.rs"

[[bench]]
name = "component_benchmark"
harness = false

[[bench]]
name = "detection_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unused_self = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
map_unwrap_or = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
match_same_arms = "warn"
